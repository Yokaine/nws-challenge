services:

  php:
    build: .
    container_name: nws_php
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html
    environment:
      DATABASE_URL: "postgresql://nws_user:nws_password@database:5432/nws_challenge?serverVersion=16&charset=utf8"
      MAILER_DSN: "smtp://mailpit:1025"
      
  database:
    image: postgres:16
    container_name: nws_database
    environment:
      POSTGRES_DB: nws_challenge
      POSTGRES_USER: nws_user
      POSTGRES_PASSWORD: nws_password
    ports:
      - "5432:5432"
    volumes:
      - database_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: nws_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  database_data: